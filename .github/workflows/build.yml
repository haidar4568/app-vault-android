name: Build App Vault APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$MANAGER"
          echo "Using $MANAGER"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            set +o pipefail
            yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null
            set -o pipefail
            "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: App-Vault-APK
          path: app/build/outputs/apk/debug/app-debug.apk
